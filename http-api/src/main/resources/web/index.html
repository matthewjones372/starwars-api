<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Star Wars Character Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #07090f;
    --panel: rgba(18, 22, 34, 0.86);
    --border: #232a3d;
    --text: #dfe4f0;
    --muted: #8b95ad;
    --accent: #ffd45e;
    --film: #4ea1ff;
    --char: #9aa7c2;
    --path: #ff7a45;
    --match: #5ce8a8;
    /* A sequential ramp for how connected a character is: one hue, rising in
       lightness, every step at 3:1 or better against the background so the
       fringe of the graph stays visible rather than fading into it. */
    --heat-0: #5b6580;
    --heat-1: #7a86a3;
    --heat-2: #9aa7c2;
    --heat-3: #c2cde1;
    --heat-4: #eaf0fb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  #stage { position: fixed; inset: 0; }
  /* The browser must not claim the touch gestures, or a pinch scrolls the page
     instead of zooming the graph and a drag never reaches d3. */
  #stage svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #stage svg:active { cursor: grabbing; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    background: linear-gradient(to bottom, rgba(7,9,15,0.95), rgba(7,9,15,0));
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  h1 {
    margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); white-space: nowrap;
  }
  #search {
    flex: 0 1 320px;
    padding: 9px 12px;
    background: rgba(12,16,26,0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }
  #status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .panel {
    position: fixed; z-index: 5;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    backdrop-filter: blur(10px);
  }
  #detail { top: 64px; left: 18px; width: 268px; }
  #detail .close {
    position: absolute; top: 8px; right: 8px;
    width: 28px; height: 28px; padding: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 17px; line-height: 1; font-weight: 400;
  }
  #pathfinder { bottom: 18px; left: 18px; width: 268px; }
  #legend { bottom: 18px; right: 18px; }
  #insights {
    top: 64px; right: 18px; width: 300px;
    max-height: calc(100vh - 180px); overflow-y: auto;
  }
  #insights[hidden] { display: none; }

  .panel h2 {
    margin: 0 0 10px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  #detail .name { font-size: 17px; font-weight: 600; margin-bottom: 10px; color: var(--accent); }
  #detail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
  #detail dt { color: var(--muted); }
  #detail dd { margin: 0; text-align: right; }
  #detail .films { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; }
  #detail .films span { color: var(--film); display: block; }
  #detail .films.people span { color: var(--text); }

  .slot {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; margin-bottom: 7px;
    border: 1px dashed var(--border); border-radius: 7px;
    font-size: 13px; min-height: 34px;
  }
  .slot.filled { border-style: solid; border-color: var(--path); }
  .slot .idx { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; }
  .slot .val { flex: 1; }
  .slot .val.empty { color: var(--muted); }
  button {
    width: 100%; padding: 8px; margin-top: 3px;
    background: var(--path); color: #1a0d06;
    border: 0; border-radius: 7px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #2a3145; color: var(--muted); cursor: default; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 400; }
  #recenter, #toggleinsights { width: auto; margin-top: 0; padding: 8px 14px; white-space: nowrap; }
  #pathresult { margin-top: 10px; font-size: 12px; color: var(--muted); }
  #pathresult .step { color: var(--text); }
  #pathresult .via { color: var(--film); }
  #pathresult .routes {
    display: flex; align-items: center; gap: 8px;
    margin: 8px 0; padding: 6px 0;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  #pathresult .which { flex: 1; text-align: center; color: var(--text); font-size: 11.5px; }
  #pathresult .cycle {
    flex: 0 0 auto; width: 30px; height: 26px; padding: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1;
  }

  #legend { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--muted); }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  #legend .ramp {
    display: inline-block; width: 72px; height: 8px; margin: 0 6px; border-radius: 4px;
    vertical-align: middle;
    background: linear-gradient(to right, var(--heat-0), var(--heat-2), var(--heat-4));
  }

  #summary { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  #summary b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  #summary div + div { margin-top: 3px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button {
    flex: 1; width: auto; margin: 0; padding: 6px 4px;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 11px; font-weight: 500;
  }
  .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--char); background: rgba(154,167,194,0.1); }

  .ranking { list-style: none; margin: 0; padding: 0; }
  .ranking + h2 { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .ranking button {
    width: 100%; margin: 0; padding: 5px 0;
    display: grid; grid-template-columns: 18px 1fr auto; align-items: baseline; gap: 8px;
    background: transparent; color: var(--text);
    border: 0; border-radius: 6px;
    font: inherit; font-size: 12.5px; font-weight: 400; text-align: left;
  }
  .ranking button:hover { background: rgba(154,167,194,0.09); }
  .ranking .pos { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .ranking .val { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .ranking .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A bar under each name, so the ranking reads as magnitudes and not just as
     an order: the gap between first and second is the point. */
  .ranking .bar { grid-column: 2 / 4; height: 4px; border-radius: 2px; margin-top: 2px; }
  .ranking .note { grid-column: 2 / 4; font-size: 10.5px; color: var(--muted); margin-top: 1px; }

  .node circle { cursor: pointer; }
  .node text {
    font-size: 10px; fill: var(--muted); pointer-events: none;
    text-anchor: middle; paint-order: stroke;
    stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
  }
  .node.film text { font-size: 12px; fill: var(--film); font-weight: 600; }

  /* Zoomed out, only the film hubs stay labelled; a character earns its label
     by being searched for, selected, on a traced path, or hovered. */
  .node.person text { transition: opacity 0.18s ease; }
  g.far .node.person text { opacity: 0; }
  g.far .node.person.match text,
  g.far .node.person.selected text,
  g.far .node.person.onpath text { opacity: 1; }
  .node.person:hover text { opacity: 1; }

  .node.dimmed { opacity: 0.12; }
  .node.match circle { stroke: var(--match); stroke-width: 2.5px; }
  .node.match text { fill: var(--match); }
  .node.onpath circle { stroke: var(--path); stroke-width: 3px; }
  .node.onpath text { fill: var(--path); }
  .node.selected circle { stroke: var(--accent); stroke-width: 3px; }

  line.link { stroke: #2b3348; stroke-width: 1px; }
  line.link.dimmed { opacity: 0.08; }
  line.link.onpath { stroke: var(--path); stroke-width: 2.5px; }

  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--muted);
  }
  #loading.done { display: none; }

  /* A phone has room for the graph or for the panels, not both at once, so the
     panels become sheets pinned under the header and above the bottom edge and
     the graph keeps the space between them. */
  @media (max-width: 720px) {
    header { padding: 10px; gap: 8px; }
    h1 { font-size: 11px; letter-spacing: 0.04em; }
    /* 16px is the threshold below which iOS Safari zooms the page on focus. */
    #search { flex: 1 1 auto; min-width: 0; font-size: 16px; padding: 10px 12px; }
    #status { display: none; }
    #recenter, #toggleinsights { padding: 10px 10px; font-size: 13px; }
    #legend { display: none; }

    .panel { padding: 12px 14px; border-radius: 10px; }
    #detail {
      top: 62px; left: 8px; right: 8px; width: auto;
      max-height: 38vh; overflow-y: auto;
    }
    #pathfinder { left: 8px; right: 8px; bottom: 8px; width: auto; }
    #insights {
      top: 62px; left: 8px; right: 8px; width: auto;
      max-height: 58vh;
    }
    #pathresult { max-height: 20vh; overflow-y: auto; }
    .slot { min-height: 40px; }
    button { padding: 11px; }
    /* The cycle buttons are a fingertip target here, not a pair of chevrons. */
    #pathresult .cycle { width: 44px; height: 38px; padding: 0; font-size: 18px; }
  }

  @media (max-width: 520px) {
    h1 { display: none; }
  }

  /* Nothing hovers on a touch screen, so the label a pointer would have
     revealed has to come from selecting, searching or tracing instead. */
  @media (hover: none) {
    .node.person:hover text { opacity: inherit; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<header>
  <h1>Star Wars Character Graph</h1>
  <input id="search" type="search" placeholder="Search characters or films…" autocomplete="off" spellcheck="false"/>
  <span id="status"></span>
  <button id="toggleinsights" class="ghost" aria-expanded="true" aria-controls="insights">Insights</button>
  <button id="recenter" class="ghost">Recenter</button>
</header>

<div class="panel" id="insights">
  <h2>The cast, measured</h2>
  <div id="summary"></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-rank="most" aria-selected="true">Most linked</button>
    <button type="button" role="tab" data-rank="least" aria-selected="false">Least linked</button>
    <button type="button" role="tab" data-rank="films" aria-selected="false">Most films</button>
  </div>
  <ol class="ranking" id="ranking"></ol>
  <h2>Films by cast</h2>
  <ol class="ranking" id="ensembles"></ol>
</div>

<div class="panel" id="detail" hidden>
  <button class="close" id="detailclose" type="button" aria-label="Close">&times;</button>
  <h2 class="kind">Character</h2>
  <div class="name"></div>
  <dl></dl>
  <div class="films"></div>
</div>

<div class="panel" id="pathfinder">
  <h2>Shortest path</h2>
  <div class="slot" data-slot="0"><span class="idx">FROM</span><span class="val empty">click a character</span></div>
  <div class="slot" data-slot="1"><span class="idx">TO</span><span class="val empty">click another</span></div>
  <button id="findpath" disabled>Trace path</button>
  <button id="clearpath" class="ghost">Clear</button>
  <div id="pathresult"></div>
</div>

<div class="panel" id="legend">
  <span><i style="background:var(--film)"></i>Film</span>
  <span>Co-stars: fewest<span class="ramp"></span>most</span>
</div>

<div id="loading">Loading the galaxy…</div>

<script>
(() => {
  "use strict";

  const PAGE_SIZE = 10;
  const idFromUrl = (url) => {
    const m = /\/(?:people|films)\/(\d+)\/?$/.exec(url || "");
    return m ? m[1] : null;
  };

  const $ = (sel) => document.querySelector(sel);
  const statusEl = $("#status");
  const setStatus = (t) => { statusEl.textContent = t; };
  const esc = (value) =>
    String(value).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const isNarrow = () => window.matchMedia("(max-width: 720px)").matches;

  // ---------------------------------------------------------------- data

  // The API pages at a fixed size and reports the total in `count`, so the
  // first page tells us how many more there are and the rest go out at once.
  async function fetchAllPeople() {
    const first = await fetch("people?page=1").then((r) => r.json());
    const pages = Math.ceil(first.count / PAGE_SIZE);
    const rest = await Promise.all(
      Array.from({ length: pages - 1 }, (_, i) =>
        fetch(`people?page=${i + 2}`).then((r) => r.json())
      )
    );
    return [first, ...rest].flatMap((p) => p.results);
  }

  // The server owns the graph, so it owns what the graph measures too: one
  // breadth-first search per character is its answer and not ours to recompute.
  // It is also the one fetch allowed to come back empty -- the API sheds load
  // under pressure, and a graph without its measurements still draws.
  async function fetchInsights() {
    try {
      const res = await fetch("graph/insights");
      return res.ok ? await res.json() : null;
    } catch {
      return null;
    }
  }

  const HEAT = ["var(--heat-0)", "var(--heat-1)", "var(--heat-2)", "var(--heat-3)", "var(--heat-4)"];

  async function load() {
    const [people, films, insights] = await Promise.all([
      fetchAllPeople(),
      fetch("films?page=1").then((r) => r.json()).then((f) => f.results),
      fetchInsights(),
    ]);

    const filmByUrl = new Map(films.map((f) => [f.url, f]));
    const connections = new Map((insights?.connections ?? []).map((c) => [c.name, c]));
    const ranks = new Map((insights?.connections ?? []).map((c, i) => [c.name, i + 1]));
    const ensembles = new Map((insights?.ensembles ?? []).map((e) => [e.title, e]));

    const counts = [...connections.values()].map((c) => c.coStars);
    const most = Math.max(...counts, 1);
    const fewest = Math.min(...counts, most);
    const biggestCast = Math.max(...[...ensembles.values()].map((e) => e.cast), 1);

    // Where every character has the same number of co-stars there is no ramp to
    // walk, so they all take the middle step rather than all taking the top one.
    const share = (value) => (most === fewest ? 0.5 : (value - fewest) / (most - fewest));
    const heatOf = (value) => HEAT[Math.min(HEAT.length - 1, Math.floor(share(value) * HEAT.length))];

    const nodes = [
      ...films.map((f) => {
        const ensemble = ensembles.get(f.title);
        return {
          id: "film:" + f.url,
          kind: "film",
          label: f.title,
          episode: f.episode_id,
          data: f,
          cast: ensemble?.cast ?? null,
          exclusiveCast: ensemble?.exclusiveCast ?? null,
          fill: "var(--film)",
          r: ensemble ? 16 + 8 * Math.sqrt(ensemble.cast / biggestCast) : 22,
        };
      }),
      ...people.map((p) => {
        const measured = connections.get(p.name);
        return {
          id: "person:" + p.url,
          kind: "person",
          label: p.name,
          entityId: idFromUrl(p.url),
          data: p,
          measured,
          rank: ranks.get(p.name) ?? null,
          fill: measured ? heatOf(measured.coStars) : "var(--char)",
          // Sized by the square root of its co-stars, so twice the connections
          // is twice the ink rather than four times it. Without the
          // measurements it falls back to the films the character is in.
          r: measured
            ? 5 + 9 * Math.sqrt(share(measured.coStars))
            : 4 + Math.min(p.films.length, 6) * 1.2,
        };
      }),
    ];

    const links = [];
    for (const p of people) {
      for (const filmUrl of p.films) {
        if (filmByUrl.has(filmUrl)) {
          links.push({ source: "person:" + p.url, target: "film:" + filmUrl });
        }
      }
    }

    return { nodes, links, people, films, insights };
  }

  // ---------------------------------------------------------------- render

  function render({ nodes, links, people }) {
    const svg = d3.select("#stage").append("svg");
    const root = svg.append("g");
    const linkLayer = root.append("g");
    const nodeLayer = root.append("g");

    // The stage can still be laid out at zero size when this runs (an embedded
    // or hidden frame does exactly that), and a zero width would centre every
    // force on the origin. So dimensions are read live and corrected by the
    // ResizeObserver below rather than snapshotted once here.
    const stage = document.getElementById("stage");
    let width = stage.clientWidth || 1200;
    let height = stage.clientHeight || 800;

    const forceX = d3.forceX(width / 2).strength(0.02);
    const forceY = d3.forceY(height / 2).strength(0.02);

    const sim = d3
      .forceSimulation(nodes)
      .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => (l.target.kind === "film" ? 130 : 90)).strength(0.28))
      .force("charge", d3.forceManyBody().strength((d) => (d.kind === "film" ? -1800 : -260)).distanceMax(900))
      .force("collide", d3.forceCollide().radius((d) => d.r + 14))
      .force("x", forceX)
      .force("y", forceY)
      // Alpha decays as usual towards a non-zero target rather than towards
      // zero, so the layout settles and then keeps breathing instead of
      // freezing into a still picture. Decay itself must stay non-zero:
      // d3 moves alpha by `(alphaTarget - alpha) * alphaDecay` per tick, so a
      // zero decay would pin alpha at its initial 1.0 forever.
      // Low enough that the drift reads as the graph breathing rather than as
      // the layout still deciding, and slow enough to click a node mid-motion.
      .alphaTarget(0.008)
      .velocityDecay(0.65);

    const link = linkLayer
      .selectAll("line")
      .data(links)
      .join("line")
      .attr("class", "link");

    const node = nodeLayer
      .selectAll("g")
      .data(nodes)
      .join("g")
      .attr("class", (d) => "node " + d.kind);

    node
      .append("circle")
      .attr("r", (d) => d.r)
      .attr("fill", (d) => d.fill);

    // The layout never stops drifting, so a character-sized dot is a small
    // moving target. This invisible disc widens what counts as a hit without
    // changing what you see, and a fingertip needs more of it than a cursor.
    const touch = window.matchMedia("(pointer: coarse)").matches;
    node
      .append("circle")
      .attr("class", "hit")
      .attr("r", (d) => d.r + (touch ? 16 : 10))
      .attr("fill", "transparent");

    node
      .append("text")
      .attr("dy", (d) => d.r + 12)
      .text((d) => d.label);

    node.call(
      d3
        .drag()
        .on("start", (event, d) => {
          if (!event.active) sim.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on("end", (event, d) => {
          if (!event.active) sim.alphaTarget(0.008);
          d.fx = null; d.fy = null;
        })
    );

    // How far apart the layout has pushed things, which is what the framing
    // below follows.
    function span() {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const n of nodes) {
        if (n.x == null) return 0;
        if (n.x < minX) minX = n.x;
        if (n.x > maxX) maxX = n.x;
        if (n.y < minY) minY = n.y;
        if (n.y > maxY) maxY = n.y;
      }
      return Math.max(maxX - minX, maxY - minY);
    }

    // The layout keeps spreading for an unpredictable while — how long depends
    // on the machine — so framing it at some fixed moment after load is a
    // guess, and a wrong guess leaves the page zoomed into a corner of a graph
    // that has since grown. Instead it is reframed whenever it has grown
    // materially, until it stops growing or the reader takes over.
    const started = performance.now();
    let autoFit = true;
    let chainFollow = 0;
    let fittedSpan = 0;
    let lastFitAt = 0;

    sim.on("tick", () => {
      link
        .attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
        .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      node.attr("transform", (d) => `translate(${d.x},${d.y})`);

      if (!autoFit) return;
      // Throttled by the clock rather than by a count of ticks: a backgrounded
      // or slow tab ticks at a fraction of the rate, and counting frames there
      // would push the reframing past the deadline below and never fit at all.
      const now = performance.now();
      if (now - started > 15000) { autoFit = false; return; }
      if (now - lastFitAt < 150) return;
      lastFitAt = now;
      const grown = span();
      if (grown > fittedSpan * 1.05) {
        fittedSpan = grown;
        fitView(250, 100, 1.2);
      }
    });

    // Character labels are noise at 82 nodes zoomed out, so they appear once
    // the view is close enough to read them; the film hubs stay labelled at
    // every zoom because they are what orients you.
    // Chosen to sit just below the scale `fitView` settles on, so the default
    // framing is labelled and names drop away only when you pull further out.
    // A phone gets the opposite default: 82 names over a few hundred pixels is
    // unreadable, so there the graph opens as shapes and a name is something
    // you select, search or trace your way to.
    const LABEL_ZOOM = isNarrow() ? 1.6 : 0.8;
    const zoom = d3
      .zoom()
      .scaleExtent([0.25, 4])
      .on("zoom", (event) => {
        root.attr("transform", event.transform);
        nodeLayer.classed("far", event.transform.k < LABEL_ZOOM);
        // A zoom the reader performed themselves ends the automatic framing;
        // one this code performed (no source event) does not.
        if (event.sourceEvent) autoFit = false;
      });
    svg.call(zoom);

    // Frames the whole graph rather than assuming a scale, which also means a
    // late resize (see the observer below) recovers on its own.
    // `maxScale` is below the zoom ceiling for the automatic fits: early on the
    // layout is still compact, and fitting that tightly would open the page
    // zoomed into a handful of nodes. Panning by hand still reaches 4x.
    // The panels lie over the canvas rather than beside it, so what the graph
    // is framed into is whatever they leave: a band between the sheets on a
    // phone, a column between the side panels anywhere else. Measured each time
    // rather than captured, so rotating a phone, or closing a panel, is
    // answered with the layout now in force.
    function viewBox() {
      if (isNarrow()) {
        const top = 56;
        const bottom = $("#pathfinder").offsetHeight + 16;
        return { x: 0, y: top, w: width, h: Math.max(height - top - bottom, 120) };
      }
      const left = 18 + $("#pathfinder").offsetWidth + 18;
      const right = $("#insights").hidden ? 18 : 18 + $("#insights").offsetWidth + 18;
      return { x: left, y: 0, w: Math.max(width - left - right, 200), h: height };
    }

    function frameTo(subject, duration, padding, maxScale) {
      const placed = subject.filter((n) => n && n.x != null);
      if (!placed.length || !width || !height) return;
      const box = viewBox();
      const xs = placed.map((n) => n.x);
      const ys = placed.map((n) => n.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      // A fixed margin is most of a phone screen, so it gives way to a share
      // of the box whenever that is the smaller of the two.
      const pad = Math.min(padding, box.w * 0.12, box.h * 0.12);
      const k = Math.max(
        0.25,
        Math.min(
          maxScale,
          (box.w - pad * 2) / Math.max(maxX - minX, 1),
          (box.h - pad * 2) / Math.max(maxY - minY, 1)
        )
      );
      const target = d3.zoomIdentity
        .translate(box.x + box.w / 2, box.y + box.h / 2)
        .scale(k)
        .translate(-(minX + maxX) / 2, -(minY + maxY) / 2);
      if (duration > 0) svg.transition().duration(duration).call(zoom.transform, target);
      else svg.call(zoom.transform, target);
    }

    // Brings one node to the middle of the box, for a name picked from a list
    // rather than found in the graph. It never zooms out: someone who has
    // pushed in close asked for that scale, and this is not a request to leave.
    function focus(node) {
      if (!node || node.x == null || !width || !height) return;
      autoFit = false;
      const box = viewBox();
      const k = Math.max(d3.zoomTransform(svg.node()).k, 1.5);
      svg
        .transition()
        .duration(500)
        .call(
          zoom.transform,
          d3.zoomIdentity
            .translate(box.x + box.w / 2, box.y + box.h / 2)
            .scale(k)
            .translate(-node.x, -node.y)
        );
    }

    // Shows a traced chain end to end. A chain already in the clear is left
    // where it is: the reader chose that view, and a path drawn between two
    // characters they can both already see is not a reason to move it.
    function frameChain(subject) {
      const placed = subject.filter((n) => n && n.x != null);
      if (!placed.length || !width || !height) return;
      const inFrame = (margin) => {
        const box = viewBox();
        const transform = d3.zoomTransform(svg.node());
        return placed.every((n) => {
          const [x, y] = transform.apply([n.x, n.y]);
          return (
            x >= box.x + margin && x <= box.x + box.w - margin &&
            y >= box.y + margin && y <= box.y + box.h - margin
          );
        });
      };

      if (inFrame(40)) return;
      autoFit = false;
      frameTo(placed, 600, 110, 2.2);

      // The layout never stops drifting, so the frame is right for where the
      // chain was when it was computed rather than where it settles. Rather
      // than track it for a fixed time, this looks once the move is over and
      // corrects only if an end has since wandered out.
      clearTimeout(chainFollow);
      chainFollow = setTimeout(() => {
        if (!inFrame(0)) frameTo(placed, 400, 110, 2.2);
      }, 900);
    }

    function fitView(duration = 600, padding = 100, maxScale = 4) {
      if (!nodes.length || nodes.some((n) => n.x == null)) return;
      frameTo(nodes, duration, padding, maxScale);
    }

    const observer = new ResizeObserver(() => {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      if (!w || !h || (w === width && h === height)) return;
      const firstRealSize = width === 1200 && height === 800;
      width = w;
      height = h;
      forceX.x(width / 2);
      forceY.y(height / 2);
      sim.alpha(0.6).restart();
      // A first real size means the layout so far was built against a guess,
      // so let it re-settle before framing it.
      fitView(firstRealSize ? 0 : 400, 100, 1.2);
    });
    observer.observe(stage);

    return { svg, zoom, root, node, link, sim, nodes, links, fitView, focus, frameChain };
  }

  // ---------------------------------------------------------------- app

  (async () => {
    let graph;
    try {
      graph = await load();
    } catch (err) {
      $("#loading").textContent = "Could not reach the API: " + err.message;
      return;
    }

    const view = render(graph);
    $("#loading").classList.add("done");

    const people = graph.people;
    const insights = graph.insights;
    const byName = new Map(graph.nodes.map((n) => [n.label, n]));
    const idle = () =>
      `${people.length} characters · ${graph.films.length} films` +
      (insights ? ` · ${insights.averageSeparation} hops apart on average` : "");
    setStatus(idle());

    // Framing is driven by the layout itself (see the tick handler), so there
    // is nothing to schedule here; Recenter is how you ask for it again.
    $("#recenter").addEventListener("click", () => view.fitView(500, 100, 1.2));

    // -- insights: the rankings the server measured, which are the quickest
    // -- answer to who sits at the middle of this cast and who sits at its edge.
    const panel = $("#insights");
    const toggle = $("#toggleinsights");

    function showInsights(open) {
      panel.hidden = !open;
      toggle.setAttribute("aria-expanded", String(open));
      // One sheet at a time on a phone: both are pinned under the header there,
      // so opening this one behind the detail would look like nothing happened.
      // The selection itself stands -- only the sheet showing it is stowed.
      if (open && isNarrow()) $("#detail").hidden = true;
    }

    const LISTED = 8;

    const TABS = {
      most: { unit: "co-stars", value: (c) => c.coStars, rows: (all) => all.slice(0, LISTED) },
      least: { unit: "co-stars", value: (c) => c.coStars, rows: (all) => all.slice(-LISTED).reverse() },
      films: {
        unit: "films",
        value: (c) => c.films,
        rows: (all) => [...all].sort((a, b) => b.films - a.films || b.coStars - a.coStars).slice(0, LISTED)
      }
    };

    function rankingRow(position, name, value, width, colour, note) {
      return (
        `<li><button type="button" data-name="${esc(name)}">` +
        `<span class="pos">${position}</span>` +
        `<span class="who">${esc(name)}</span>` +
        `<span class="val">${value}</span>` +
        `<span class="bar" style="width:${width}%;background:${colour}"></span>` +
        (note ? `<span class="note">${esc(note)}</span>` : "") +
        `</button></li>`
      );
    }

    function renderRanking(which) {
      const tab = TABS[which];
      const rows = tab.rows(insights.connections);
      // Scaled against the whole cast rather than against the rows on screen,
      // or the least connected character would draw a full bar for being the
      // longest of the short ones.
      const widest = Math.max(...insights.connections.map(tab.value), 1);
      document.querySelectorAll(".tabs button").forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.rank === which));
      });
      $("#ranking").innerHTML = rows
        .map((c, i) =>
          rankingRow(
            i + 1,
            c.name,
            `${tab.value(c)} ${tab.unit}`,
            (tab.value(c) / widest) * 100,
            // Colour follows the character, not its place in this list, so the
            // dot beside a name is the dot it has out in the graph.
            byName.get(c.name)?.fill ?? "var(--heat-2)",
            null
          )
        )
        .join("");
    }

    function renderInsights() {
      if (!insights) {
        showInsights(false);
        toggle.hidden = true;
        return;
      }

      $("#summary").innerHTML = [
        `<div><b>${insights.characters}</b> characters across <b>${insights.films}</b> films</div>`,
        `<div><b>${insights.pairs.toLocaleString()}</b> pairs share a film, ` +
          `<b>${Math.round(insights.density * 100)}%</b> of every pair there could be</div>`,
        // Across clusters there is no path at all, so the widest gap is only
        // the whole cast's when the whole cast is one cluster.
        insights.clusters === 1
          ? `<div>Everyone reaches everyone, and no one is more than ` +
            `<b>${insights.diameter}</b> hop${insights.diameter === 1 ? "" : "s"} away</div>`
          : `<div><b>${insights.clusters}</b> clusters that never meet, ` +
            `<b>${insights.diameter}</b> hop${insights.diameter === 1 ? "" : "s"} across the widest of them</div>`
      ].join("");

      const widest = Math.max(...insights.ensembles.map((e) => e.cast), 1);
      $("#ensembles").innerHTML = insights.ensembles
        .map((e, i) =>
          rankingRow(
            i + 1,
            e.title,
            `${e.cast} cast`,
            (e.cast / widest) * 100,
            "var(--film)",
            `${e.exclusiveCast} appear in no other film`
          )
        )
        .join("");

      renderRanking("most");
      // A phone has room for one sheet at a time, so the panel waits to be asked.
      showInsights(!isNarrow());
    }

    toggle.addEventListener("click", () => showInsights(panel.hidden));

    panel.addEventListener("click", (event) => {
      const tab = event.target.closest("button[data-rank]");
      if (tab) { renderRanking(tab.dataset.rank); return; }
      const row = event.target.closest("button[data-name]");
      if (!row) return;
      const node = byName.get(row.dataset.name);
      // A pick that completes a pair is about to be traced, and the trace
      // frames the whole chain; centring on this one end would fight it.
      if (!select(node)) view.focus(node);
      if (isNarrow()) showInsights(false);
    });

    // -- search: filters the rendered graph rather than the API, because the
    // -- whole data set is already here and a keystroke should cost nothing.
    let matches = new Set();
    $("#search").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      matches = new Set();
      if (q) {
        for (const n of graph.nodes) {
          if (n.label.toLowerCase().includes(q)) matches.add(n.id);
        }
      }
      applyClasses();
      setStatus(q ? `${matches.size} match${matches.size === 1 ? "" : "es"}` : idle());
      view.sim.alpha(0.3);
    });

    // -- selection + detail panel
    let selected = null;
    let pathNodes = new Set();
    let pathLinks = new Set();
    let chains = [];
    let chainAt = 0;
    let chainTotal = 0;
    let pathEnd = null;
    let pathFilms = 0;
    const slots = [null, null];

    function applyClasses() {
      const filtering = matches.size > 0;
      // A traced path outranks the search filter: it was asked for explicitly,
      // so it stays lit even when the current query does not name its nodes.
      view.node
        .classed("dimmed", (d) => filtering && !matches.has(d.id) && !pathNodes.has(d.id))
        .classed("match", (d) => matches.has(d.id))
        .classed("selected", (d) => selected && d.id === selected.id)
        .classed("onpath", (d) => pathNodes.has(d.id));
      view.link
        .classed("dimmed", (d) => {
          const key = d.source.id + "|" + d.target.id;
          if (pathLinks.has(key)) return false;
          return filtering && !matches.has(d.source.id) && !matches.has(d.target.id);
        })
        .classed("onpath", (d) => pathLinks.has(d.source.id + "|" + d.target.id));
    }

    const castOf = (filmUrl) => people.filter((p) => p.films.includes(filmUrl));

    function fillDetail(kind, name, rows, heading, listed) {
      const detail = $("#detail");
      const list = detail.querySelector(".films");
      detail.hidden = false;
      detail.querySelector(".kind").textContent = kind;
      detail.querySelector(".name").textContent = name;
      detail.querySelector("dl").innerHTML = rows
        .filter(([, value]) => value != null && value !== "" && value !== "n/a")
        .map(([label, value]) => `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`)
        .join("");
      // A film lists characters and a character lists films, which are the two
      // colours this page already uses for those things.
      list.classList.toggle("people", kind === "Film");
      list.innerHTML = `<h2>${esc(heading)}</h2>` + listed.map((entry) => `<span>${esc(entry)}</span>`).join("");
    }

    function showFilmDetail(d) {
      const cast = castOf(d.data.url);
      // Who carries this film, by the measure the rest of the page uses.
      const leads = [...cast]
        .sort((a, b) => (byName.get(b.name)?.measured?.coStars ?? 0) - (byName.get(a.name)?.measured?.coStars ?? 0))
        .slice(0, 5)
        .map((p) => p.name);

      fillDetail(
        "Film",
        d.label,
        [
          ["Episode", d.episode],
          ["Released", d.data.release_date],
          ["Director", d.data.director],
          ["Cast", d.cast ?? cast.length],
          ["Only here", d.exclusiveCast]
        ],
        "Most linked in it",
        leads
      );
    }

    function showDetail(d) {
      if (d.kind === "film") { showFilmDetail(d); return; }
      const p = d.data;
      const measured = d.measured;
      const titles = graph.nodes
        .filter((n) => n.kind === "film" && p.films.includes(n.id.slice(5)))
        .map((f) => f.label);

      fillDetail(
        "Character",
        p.name,
        [
          ...(measured
            ? [
                ["Co-stars", `${measured.coStars} of ${insights.characters - 1}`],
                ["Rank", `#${d.rank} of ${insights.characters}`],
                ["Avg separation", `${measured.averageSeparation.toFixed(2)} hops`],
                ["Films", measured.films]
              ]
            : [["Films", p.films.length]]),
          ["Birth year", p.birth_year],
          ["Gender", p.gender],
          ["Height", p.height ? p.height + " cm" : null],
          ["Mass", p.mass ? p.mass + " kg" : null],
          ["Eyes", p.eye_color],
          ["Hair", p.hair_color]
        ],
        "Appears in",
        titles
      );
    }

    function updateSlots() {
      document.querySelectorAll(".slot").forEach((el, i) => {
        const val = el.querySelector(".val");
        if (slots[i]) {
          el.classList.add("filled");
          val.classList.remove("empty");
          val.textContent = slots[i].label;
        } else {
          el.classList.remove("filled");
          val.classList.add("empty");
          val.textContent = i === 0 ? "click a character" : "click another";
        }
      });
      $("#findpath").disabled = !(slots[0] && slots[1]);
    }

    function select(d) {
      if (!d) return false;
      selected = d;
      showDetail(d);
      let tracing = false;
      if (d.kind === "person") {
        if (!slots[0] || (slots[0] && slots[1])) {
          // Starting a fresh pair, so the routes drawn for the last one go.
          slots[0] = d;
          slots[1] = null;
          clearChains();
        } else if (d.id !== slots[0].id) {
          slots[1] = d;
        }
        updateSlots();
        if (slots[0] && slots[1]) {
          tracePath();
          tracing = true;
        }
      }
      applyClasses();
      return tracing;
    }

    view.node.on("click", (event, d) => {
      event.stopPropagation();
      if (isNarrow()) showInsights(false);
      select(d);
    });

    function closeDetail() {
      selected = null;
      $("#detail").hidden = true;
      applyClasses();
    }

    view.svg.on("click", closeDetail);

    // On a phone the sheet covers most of the canvas, so there is not much
    // empty graph left to tap to dismiss it.
    $("#detailclose").addEventListener("click", (event) => {
      event.stopPropagation();
      closeDetail();
    });

    // -- shortest path: this one really does go to the API, because the BFS
    // -- over shared films is the server's answer and not ours to recompute.
    async function tracePath() {
      const [a, b] = slots;
      if (!a || !b) return;
      const result = $("#pathresult");
      result.textContent = "Tracing…";
      try {
        const res = await fetch(`people/${a.entityId}/path-to/${b.entityId}`);
        if (!res.ok) { result.textContent = `No path (${res.status})`; return; }
        const path = await res.json();

        // The server hands back every chain of the shortest length, not one of
        // them: at a single hop those are the films the pair share, and beyond
        // it they are the different characters the chain can run through.
        chains = [path.steps, ...path.alternatives.map((alternative) => alternative.steps)];
        chainTotal = path.chains;
        pathEnd = path.end;
        pathFilms = path.films;
        showChain(0);
      } catch (err) {
        result.textContent = "Failed: " + err.message;
      }
    }

    // A step names a character and the film that carries the chain on to the
    // next one, so each step is two edges through the graph and not one: the
    // character into the film, and the following character back out of it. The
    // character on the far side of the last film is the path's end, which is
    // why it closes the walk here rather than in a case of its own.
    function showChain(index) {
      if (!chains.length) return;
      chainAt = (index + chains.length) % chains.length;
      const steps = chains[chainAt];
      const lit = [];
      pathNodes = new Set();
      pathLinks = new Set();
      steps.forEach((step, i) => {
        const person = byName.get(step.person);
        const film = byName.get(step.film);
        const next = byName.get(steps[i + 1]?.person ?? pathEnd);
        lit.push(person, film, next);
        if (person) pathNodes.add(person.id);
        if (film) pathNodes.add(film.id);
        if (next) pathNodes.add(next.id);
        // Every link runs character -> film, so both edges key that way.
        if (person && film) pathLinks.add(person.id + "|" + film.id);
        if (next && film) pathLinks.add(next.id + "|" + film.id);
      });

      const capped = chainTotal > chains.length;
      $("#pathresult").innerHTML =
        `<div><b>${pathFilms}</b> film${pathFilms === 1 ? "" : "s"} apart</div>` +
        (chains.length > 1
          ? `<div class="routes" title="Left and right arrow keys cycle too">` +
            `<button type="button" class="ghost cycle" data-step="-1" aria-label="Previous route">&lsaquo;</button>` +
            `<span class="which">Route ${chainAt + 1} of ${chains.length}` +
            (capped ? ` · ${chainTotal} in all` : "") +
            `</span>` +
            `<button type="button" class="ghost cycle" data-step="1" aria-label="Next route">&rsaquo;</button>` +
            `</div>`
          : "") +
        steps
          .map((s) => `<div><span class="step">${esc(s.person)}</span> <span class="via">via ${esc(s.film)}</span></div>`)
          .join("") +
        `<div><span class="step">${esc(pathEnd)}</span></div>`;

      applyClasses();
      // No alpha kick here. Re-energising the layout spreads the chain apart
      // while the camera is still travelling to where it used to be, which is
      // how an end of the path ends up outside the frame. The path lighting up,
      // and the view coming to meet it, are the acknowledgement.
      view.frameChain(lit);
    }

    function clearChains() {
      chains = [];
      chainAt = 0;
      chainTotal = 0;
      pathNodes = new Set();
      pathLinks = new Set();
      $("#pathresult").textContent = "";
    }

    $("#pathresult").addEventListener("click", (event) => {
      const cycle = event.target.closest("button[data-step]");
      if (cycle) showChain(chainAt + Number(cycle.dataset.step));
    });

    // The arrow keys reach the routes without aiming at a 30px button, so long
    // as they are not being typed into the search box.
    document.addEventListener("keydown", (event) => {
      if (chains.length < 2 || event.target.matches("input, textarea")) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      showChain(chainAt + (event.key === "ArrowLeft" ? -1 : 1));
    });

    // The button stays for retracing the same pair after a clear, but picking
    // the second character is itself the request, so it does not wait for one.
    $("#findpath").addEventListener("click", tracePath);

    $("#clearpath").addEventListener("click", () => {
      slots[0] = slots[1] = null;
      clearChains();
      updateSlots();
      applyClasses();
    });

    updateSlots();
    renderInsights();
  })();
})();
</script>
</body>
</html>
