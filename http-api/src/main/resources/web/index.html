<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Star Wars Character Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #07090f;
    --panel: rgba(18, 22, 34, 0.86);
    --border: #232a3d;
    --text: #dfe4f0;
    --muted: #8b95ad;
    --accent: #ffd45e;
    --film: #4ea1ff;
    --char: #9aa7c2;
    --path: #ff7a45;
    --match: #5ce8a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  #stage { position: fixed; inset: 0; }
  /* The browser must not claim the touch gestures, or a pinch scrolls the page
     instead of zooming the graph and a drag never reaches d3. */
  #stage svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #stage svg:active { cursor: grabbing; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    background: linear-gradient(to bottom, rgba(7,9,15,0.95), rgba(7,9,15,0));
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  h1 {
    margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); white-space: nowrap;
  }
  #search {
    flex: 0 1 320px;
    padding: 9px 12px;
    background: rgba(12,16,26,0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }
  #status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .panel {
    position: fixed; z-index: 5;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    backdrop-filter: blur(10px);
  }
  #detail { top: 64px; left: 18px; width: 268px; }
  #detail .close {
    position: absolute; top: 8px; right: 8px;
    width: 28px; height: 28px; padding: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 17px; line-height: 1; font-weight: 400;
  }
  #pathfinder { bottom: 18px; left: 18px; width: 268px; }
  #legend { bottom: 18px; right: 18px; }

  .panel h2 {
    margin: 0 0 10px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  #detail .name { font-size: 17px; font-weight: 600; margin-bottom: 10px; color: var(--accent); }
  #detail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
  #detail dt { color: var(--muted); }
  #detail dd { margin: 0; text-align: right; }
  #detail .films { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; }
  #detail .films span { color: var(--film); display: block; }

  .slot {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; margin-bottom: 7px;
    border: 1px dashed var(--border); border-radius: 7px;
    font-size: 13px; min-height: 34px;
  }
  .slot.filled { border-style: solid; border-color: var(--path); }
  .slot .idx { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; }
  .slot .val { flex: 1; }
  .slot .val.empty { color: var(--muted); }
  button {
    width: 100%; padding: 8px; margin-top: 3px;
    background: var(--path); color: #1a0d06;
    border: 0; border-radius: 7px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #2a3145; color: var(--muted); cursor: default; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 400; }
  #recenter { width: auto; margin-top: 0; padding: 8px 14px; white-space: nowrap; }
  #pathresult { margin-top: 10px; font-size: 12px; color: var(--muted); }
  #pathresult .step { color: var(--text); }
  #pathresult .via { color: var(--film); }

  #legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

  .node circle { cursor: pointer; }
  .node text {
    font-size: 10px; fill: var(--muted); pointer-events: none;
    text-anchor: middle; paint-order: stroke;
    stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
  }
  .node.film text { font-size: 12px; fill: var(--film); font-weight: 600; }

  /* Zoomed out, only the film hubs stay labelled; a character earns its label
     by being searched for, selected, on a traced path, or hovered. */
  .node.person text { transition: opacity 0.18s ease; }
  g.far .node.person text { opacity: 0; }
  g.far .node.person.match text,
  g.far .node.person.selected text,
  g.far .node.person.onpath text { opacity: 1; }
  .node.person:hover text { opacity: 1; }

  .node.dimmed { opacity: 0.12; }
  .node.match circle { stroke: var(--match); stroke-width: 2.5px; }
  .node.match text { fill: var(--match); }
  .node.onpath circle { stroke: var(--path); stroke-width: 3px; }
  .node.onpath text { fill: var(--path); }
  .node.selected circle { stroke: var(--accent); stroke-width: 3px; }

  line.link { stroke: #2b3348; stroke-width: 1px; }
  line.link.dimmed { opacity: 0.08; }
  line.link.onpath { stroke: var(--path); stroke-width: 2.5px; }

  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--muted);
  }
  #loading.done { display: none; }

  /* A phone has room for the graph or for the panels, not both at once, so the
     panels become sheets pinned under the header and above the bottom edge and
     the graph keeps the space between them. */
  @media (max-width: 720px) {
    header { padding: 10px; gap: 8px; }
    h1 { font-size: 11px; letter-spacing: 0.04em; }
    /* 16px is the threshold below which iOS Safari zooms the page on focus. */
    #search { flex: 1 1 auto; min-width: 0; font-size: 16px; padding: 10px 12px; }
    #status { display: none; }
    #recenter { padding: 10px 12px; }
    #legend { display: none; }

    .panel { padding: 12px 14px; border-radius: 10px; }
    #detail {
      top: 62px; left: 8px; right: 8px; width: auto;
      max-height: 38vh; overflow-y: auto;
    }
    #pathfinder { left: 8px; right: 8px; bottom: 8px; width: auto; }
    #pathresult { max-height: 20vh; overflow-y: auto; }
    .slot { min-height: 40px; }
    button { padding: 11px; }
  }

  @media (max-width: 520px) {
    h1 { display: none; }
  }

  /* Nothing hovers on a touch screen, so the label a pointer would have
     revealed has to come from selecting, searching or tracing instead. */
  @media (hover: none) {
    .node.person:hover text { opacity: inherit; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<header>
  <h1>Star Wars Character Graph</h1>
  <input id="search" type="search" placeholder="Search characters or films…" autocomplete="off" spellcheck="false"/>
  <span id="status"></span>
  <button id="recenter" class="ghost">Recenter</button>
</header>

<div class="panel" id="detail" hidden>
  <button class="close" id="detailclose" type="button" aria-label="Close">&times;</button>
  <h2>Character</h2>
  <div class="name"></div>
  <dl></dl>
  <div class="films"></div>
</div>

<div class="panel" id="pathfinder">
  <h2>Shortest path</h2>
  <div class="slot" data-slot="0"><span class="idx">FROM</span><span class="val empty">click a character</span></div>
  <div class="slot" data-slot="1"><span class="idx">TO</span><span class="val empty">click another</span></div>
  <button id="findpath" disabled>Trace path</button>
  <button id="clearpath" class="ghost">Clear</button>
  <div id="pathresult"></div>
</div>

<div class="panel" id="legend">
  <span><i style="background:var(--film)"></i>Film</span>
  <span><i style="background:var(--char)"></i>Character</span>
</div>

<div id="loading">Loading the galaxy…</div>

<script>
(() => {
  "use strict";

  const PAGE_SIZE = 10;
  const idFromUrl = (url) => {
    const m = /\/(?:people|films)\/(\d+)\/?$/.exec(url || "");
    return m ? m[1] : null;
  };

  const $ = (sel) => document.querySelector(sel);
  const statusEl = $("#status");
  const setStatus = (t) => { statusEl.textContent = t; };

  // ---------------------------------------------------------------- data

  // The API pages at a fixed size and reports the total in `count`, so the
  // first page tells us how many more there are and the rest go out at once.
  async function fetchAllPeople() {
    const first = await fetch("people?page=1").then((r) => r.json());
    const pages = Math.ceil(first.count / PAGE_SIZE);
    const rest = await Promise.all(
      Array.from({ length: pages - 1 }, (_, i) =>
        fetch(`people?page=${i + 2}`).then((r) => r.json())
      )
    );
    return [first, ...rest].flatMap((p) => p.results);
  }

  async function load() {
    const [people, films] = await Promise.all([
      fetchAllPeople(),
      fetch("films?page=1").then((r) => r.json()).then((f) => f.results),
    ]);

    const filmByUrl = new Map(films.map((f) => [f.url, f]));

    const nodes = [
      ...films.map((f) => ({
        id: "film:" + f.url,
        kind: "film",
        label: f.title,
        episode: f.episode_id,
        r: 22,
      })),
      ...people.map((p) => ({
        id: "person:" + p.url,
        kind: "person",
        label: p.name,
        entityId: idFromUrl(p.url),
        data: p,
        // A character in more films sits on more edges, so give it more mass.
        r: 4 + Math.min(p.films.length, 6) * 1.2,
      })),
    ];

    const links = [];
    for (const p of people) {
      for (const filmUrl of p.films) {
        if (filmByUrl.has(filmUrl)) {
          links.push({ source: "person:" + p.url, target: "film:" + filmUrl });
        }
      }
    }

    return { nodes, links, people, films };
  }

  // ---------------------------------------------------------------- render

  function render({ nodes, links, people }) {
    const svg = d3.select("#stage").append("svg");
    const root = svg.append("g");
    const linkLayer = root.append("g");
    const nodeLayer = root.append("g");

    // The stage can still be laid out at zero size when this runs (an embedded
    // or hidden frame does exactly that), and a zero width would centre every
    // force on the origin. So dimensions are read live and corrected by the
    // ResizeObserver below rather than snapshotted once here.
    const stage = document.getElementById("stage");
    let width = stage.clientWidth || 1200;
    let height = stage.clientHeight || 800;

    // Asked each time rather than captured, so rotating a phone or dragging a
    // window across the breakpoint is answered with the layout now in force.
    const isNarrow = () => window.matchMedia("(max-width: 720px)").matches;

    const forceX = d3.forceX(width / 2).strength(0.02);
    const forceY = d3.forceY(height / 2).strength(0.02);

    const sim = d3
      .forceSimulation(nodes)
      .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => (l.target.kind === "film" ? 130 : 90)).strength(0.28))
      .force("charge", d3.forceManyBody().strength((d) => (d.kind === "film" ? -1800 : -260)).distanceMax(900))
      .force("collide", d3.forceCollide().radius((d) => d.r + 14))
      .force("x", forceX)
      .force("y", forceY)
      // Alpha decays as usual towards a non-zero target rather than towards
      // zero, so the layout settles and then keeps breathing instead of
      // freezing into a still picture. Decay itself must stay non-zero:
      // d3 moves alpha by `(alphaTarget - alpha) * alphaDecay` per tick, so a
      // zero decay would pin alpha at its initial 1.0 forever.
      // Low enough that the drift reads as the graph breathing rather than as
      // the layout still deciding, and slow enough to click a node mid-motion.
      .alphaTarget(0.008)
      .velocityDecay(0.65);

    const link = linkLayer
      .selectAll("line")
      .data(links)
      .join("line")
      .attr("class", "link");

    const node = nodeLayer
      .selectAll("g")
      .data(nodes)
      .join("g")
      .attr("class", (d) => "node " + d.kind);

    node
      .append("circle")
      .attr("r", (d) => d.r)
      .attr("fill", (d) => (d.kind === "film" ? "var(--film)" : "var(--char)"));

    // The layout never stops drifting, so a character-sized dot is a small
    // moving target. This invisible disc widens what counts as a hit without
    // changing what you see, and a fingertip needs more of it than a cursor.
    const touch = window.matchMedia("(pointer: coarse)").matches;
    node
      .append("circle")
      .attr("class", "hit")
      .attr("r", (d) => d.r + (touch ? 16 : 10))
      .attr("fill", "transparent");

    node
      .append("text")
      .attr("dy", (d) => d.r + 12)
      .text((d) => d.label);

    node.call(
      d3
        .drag()
        .on("start", (event, d) => {
          if (!event.active) sim.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on("end", (event, d) => {
          if (!event.active) sim.alphaTarget(0.008);
          d.fx = null; d.fy = null;
        })
    );

    // How far apart the layout has pushed things, which is what the framing
    // below follows.
    function span() {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const n of nodes) {
        if (n.x == null) return 0;
        if (n.x < minX) minX = n.x;
        if (n.x > maxX) maxX = n.x;
        if (n.y < minY) minY = n.y;
        if (n.y > maxY) maxY = n.y;
      }
      return Math.max(maxX - minX, maxY - minY);
    }

    // The layout keeps spreading for an unpredictable while — how long depends
    // on the machine — so framing it at some fixed moment after load is a
    // guess, and a wrong guess leaves the page zoomed into a corner of a graph
    // that has since grown. Instead it is reframed whenever it has grown
    // materially, until it stops growing or the reader takes over.
    const started = performance.now();
    let autoFit = true;
    let fittedSpan = 0;
    let lastFitAt = 0;

    sim.on("tick", () => {
      link
        .attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
        .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      node.attr("transform", (d) => `translate(${d.x},${d.y})`);

      if (!autoFit) return;
      // Throttled by the clock rather than by a count of ticks: a backgrounded
      // or slow tab ticks at a fraction of the rate, and counting frames there
      // would push the reframing past the deadline below and never fit at all.
      const now = performance.now();
      if (now - started > 15000) { autoFit = false; return; }
      if (now - lastFitAt < 150) return;
      lastFitAt = now;
      const grown = span();
      if (grown > fittedSpan * 1.05) {
        fittedSpan = grown;
        fitView(250, 100, 1.2);
      }
    });

    // Character labels are noise at 82 nodes zoomed out, so they appear once
    // the view is close enough to read them; the film hubs stay labelled at
    // every zoom because they are what orients you.
    // Chosen to sit just below the scale `fitView` settles on, so the default
    // framing is labelled and names drop away only when you pull further out.
    // A phone gets the opposite default: 82 names over a few hundred pixels is
    // unreadable, so there the graph opens as shapes and a name is something
    // you select, search or trace your way to.
    const LABEL_ZOOM = isNarrow() ? 1.6 : 0.8;
    const zoom = d3
      .zoom()
      .scaleExtent([0.25, 4])
      .on("zoom", (event) => {
        root.attr("transform", event.transform);
        nodeLayer.classed("far", event.transform.k < LABEL_ZOOM);
        // A zoom the reader performed themselves ends the automatic framing;
        // one this code performed (no source event) does not.
        if (event.sourceEvent) autoFit = false;
      });
    svg.call(zoom);

    // Frames the whole graph rather than assuming a scale, which also means a
    // late resize (see the observer below) recovers on its own.
    // `maxScale` is below the zoom ceiling for the automatic fits: early on the
    // layout is still compact, and fitting that tightly would open the page
    // zoomed into a handful of nodes. Panning by hand still reaches 4x.
    function fitView(duration = 600, padding = 100, maxScale = 4) {
      if (!width || !height || !nodes.length || nodes.some((n) => n.x == null)) return;
      const xs = nodes.map((n) => n.x);
      const ys = nodes.map((n) => n.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const spanX = Math.max(maxX - minX, 1);
      const spanY = Math.max(maxY - minY, 1);
      // A fixed margin is most of a phone screen, so it gives way to a share
      // of the viewport whenever that is the smaller of the two.
      const pad = Math.min(padding, width * 0.12, height * 0.12);
      // Where the panels are sheets rather than side panels they cover the
      // canvas, so the graph is fitted to the band left between them instead
      // of to the viewport it would otherwise share with them.
      const header = isNarrow() ? 56 : 0;
      const sheet = isNarrow() ? $("#pathfinder").offsetHeight + 16 : 0;
      const usableH = Math.max(height - header - sheet, 120);
      const k = Math.max(
        0.25,
        Math.min(maxScale, (width - pad * 2) / spanX, (usableH - pad * 2) / spanY)
      );
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const target = d3.zoomIdentity
        .translate(width / 2, header + usableH / 2)
        .scale(k)
        .translate(-cx, -cy);
      if (duration > 0) svg.transition().duration(duration).call(zoom.transform, target);
      else svg.call(zoom.transform, target);
    }

    const observer = new ResizeObserver(() => {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      if (!w || !h || (w === width && h === height)) return;
      const firstRealSize = width === 1200 && height === 800;
      width = w;
      height = h;
      forceX.x(width / 2);
      forceY.y(height / 2);
      sim.alpha(0.6).restart();
      // A first real size means the layout so far was built against a guess,
      // so let it re-settle before framing it.
      fitView(firstRealSize ? 0 : 400, 100, 1.2);
    });
    observer.observe(stage);

    return { svg, zoom, root, node, link, sim, nodes, links, fitView };
  }

  // ---------------------------------------------------------------- app

  (async () => {
    let graph;
    try {
      graph = await load();
    } catch (err) {
      $("#loading").textContent = "Could not reach the API: " + err.message;
      return;
    }

    const view = render(graph);
    $("#loading").classList.add("done");

    const people = graph.people;
    setStatus(`${people.length} characters · ${graph.films.length} films`);

    // Framing is driven by the layout itself (see the tick handler), so there
    // is nothing to schedule here; Recenter is how you ask for it again.
    $("#recenter").addEventListener("click", () => view.fitView(500, 100, 1.2));

    // -- search: filters the rendered graph rather than the API, because the
    // -- whole data set is already here and a keystroke should cost nothing.
    let matches = new Set();
    $("#search").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      matches = new Set();
      if (q) {
        for (const n of graph.nodes) {
          if (n.label.toLowerCase().includes(q)) matches.add(n.id);
        }
      }
      applyClasses();
      setStatus(
        q
          ? `${matches.size} match${matches.size === 1 ? "" : "es"}`
          : `${people.length} characters · ${graph.films.length} films`
      );
      view.sim.alpha(0.3);
    });

    // -- selection + detail panel
    let selected = null;
    let pathNodes = new Set();
    let pathLinks = new Set();
    const slots = [null, null];

    function applyClasses() {
      const filtering = matches.size > 0;
      // A traced path outranks the search filter: it was asked for explicitly,
      // so it stays lit even when the current query does not name its nodes.
      view.node
        .classed("dimmed", (d) => filtering && !matches.has(d.id) && !pathNodes.has(d.id))
        .classed("match", (d) => matches.has(d.id))
        .classed("selected", (d) => selected && d.id === selected.id)
        .classed("onpath", (d) => pathNodes.has(d.id));
      view.link
        .classed("dimmed", (d) => {
          const key = d.source.id + "|" + d.target.id;
          if (pathLinks.has(key)) return false;
          return filtering && !matches.has(d.source.id) && !matches.has(d.target.id);
        })
        .classed("onpath", (d) => pathLinks.has(d.source.id + "|" + d.target.id));
    }

    function showDetail(d) {
      const panel = $("#detail");
      if (d.kind !== "person") { panel.hidden = true; return; }
      const p = d.data;
      panel.hidden = false;
      panel.querySelector(".name").textContent = p.name;
      const rows = [
        ["Birth year", p.birth_year],
        ["Gender", p.gender],
        ["Height", p.height ? p.height + " cm" : null],
        ["Mass", p.mass ? p.mass + " kg" : null],
        ["Eyes", p.eye_color],
        ["Hair", p.hair_color],
      ].filter(([, v]) => v && v !== "n/a");
      panel.querySelector("dl").innerHTML = rows
        .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`)
        .join("");
      const titles = graph.nodes.filter(
        (n) => n.kind === "film" && p.films.includes(n.id.slice(5))
      );
      panel.querySelector(".films").innerHTML =
        `<h2>Appears in</h2>` + titles.map((f) => `<span>${f.label}</span>`).join("");
    }

    function updateSlots() {
      document.querySelectorAll(".slot").forEach((el, i) => {
        const val = el.querySelector(".val");
        if (slots[i]) {
          el.classList.add("filled");
          val.classList.remove("empty");
          val.textContent = slots[i].label;
        } else {
          el.classList.remove("filled");
          val.classList.add("empty");
          val.textContent = i === 0 ? "click a character" : "click another";
        }
      });
      $("#findpath").disabled = !(slots[0] && slots[1]);
    }

    view.node.on("click", (event, d) => {
      event.stopPropagation();
      selected = d;
      showDetail(d);
      if (d.kind === "person") {
        if (!slots[0] || (slots[0] && slots[1])) {
          // Starting a fresh pair, so the path drawn for the last one goes.
          slots[0] = d;
          slots[1] = null;
          pathNodes = new Set();
          pathLinks = new Set();
          $("#pathresult").textContent = "";
        } else if (d.id !== slots[0].id) {
          slots[1] = d;
        }
        updateSlots();
        if (slots[0] && slots[1]) tracePath();
      }
      applyClasses();
    });

    function closeDetail() {
      selected = null;
      $("#detail").hidden = true;
      applyClasses();
    }

    view.svg.on("click", closeDetail);

    // On a phone the sheet covers most of the canvas, so there is not much
    // empty graph left to tap to dismiss it.
    $("#detailclose").addEventListener("click", (event) => {
      event.stopPropagation();
      closeDetail();
    });

    // -- shortest path: this one really does go to the API, because the BFS
    // -- over shared films is the server's answer and not ours to recompute.
    async function tracePath() {
      const [a, b] = slots;
      if (!a || !b) return;
      const result = $("#pathresult");
      result.textContent = "Tracing…";
      try {
        const res = await fetch(`people/${a.entityId}/path-to/${b.entityId}`);
        if (!res.ok) { result.textContent = `No path (${res.status})`; return; }
        const path = await res.json();

        // The response names characters and the film joining each hop; the
        // rendered graph keys on urls, so names map back through the nodes.
        const byName = new Map(graph.nodes.map((n) => [n.label, n]));
        pathNodes = new Set();
        pathLinks = new Set();
        // A step names a character and the film that carries the chain on to
        // the next one, so each step is two edges through the graph and not
        // one: the character into the film, and the following character back
        // out of it. The character on the far side of the last film is
        // `path.end`, which is why it closes the walk here rather than in a
        // case of its own.
        path.steps.forEach((step, i) => {
          const person = byName.get(step.person);
          const film = byName.get(step.film);
          const next = byName.get(path.steps[i + 1]?.person ?? path.end);
          if (person) pathNodes.add(person.id);
          if (film) pathNodes.add(film.id);
          if (next) pathNodes.add(next.id);
          // Every link runs character -> film, so both edges key that way.
          if (person && film) pathLinks.add(person.id + "|" + film.id);
          if (next && film) pathLinks.add(next.id + "|" + film.id);
        });

        result.innerHTML =
          `<div><b>${path.films}</b> film${path.films === 1 ? "" : "s"} apart</div>` +
          path.steps
            .map((s) => `<div><span class="step">${s.person}</span> <span class="via">via ${s.film}</span></div>`)
            .join("") +
          `<div><span class="step">${path.end}</span></div>`;

        applyClasses();
        view.sim.alpha(0.4);
      } catch (err) {
        result.textContent = "Failed: " + err.message;
      }
    }

    // The button stays for retracing the same pair after a clear, but picking
    // the second character is itself the request, so it does not wait for one.
    $("#findpath").addEventListener("click", tracePath);

    $("#clearpath").addEventListener("click", () => {
      slots[0] = slots[1] = null;
      pathNodes = new Set();
      pathLinks = new Set();
      $("#pathresult").textContent = "";
      updateSlots();
      applyClasses();
    });

    updateSlots();
  })();
})();
</script>
</body>
</html>
